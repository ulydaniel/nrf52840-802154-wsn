# ==========================================================
# Networking / IEEE 802.15.4
# ==========================================================

CONFIG_NETWORKING=y

CONFIG_NET_L2_IEEE802154=y

CONFIG_IEEE802154=y
CONFIG_IEEE802154_NRF5=y

CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_NET_SOCKETS_PACKET_DGRAM=y

# ==========================================================
# Heartbeat: GUID (hwinfo) and battery level (SAADC)
# ==========================================================

CONFIG_HWINFO=y
CONFIG_ADC=y
# ==========================================================
# Logging / SEGGER RTT
# ==========================================================

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# Larger buffers so the boot log is kept until an RTT viewer
# attaches (with 1 KB, later boot messages, including errors,
# were dropped when no viewer was reading).
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y

CONFIG_UART_CONSOLE=n